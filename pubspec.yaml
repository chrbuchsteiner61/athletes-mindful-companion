name: athletes_mindful_companion
description: Athlete's Mindful Companion – ein interaktiver mentaler Begleiter für Einzelsportler.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage (Offline-First, JSON file store)
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3+1

  # Secure Storage (API Keys / Token)
  flutter_secure_storage: ^9.2.2

  # LLM Integration
  http: ^1.2.2

  # Speech-to-Text (Low-Friction UI)
  record: ^5.1.0

  # Local Notifications (Brücken-Strategie)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5

  # Export (JSON / CSV Backup)
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
